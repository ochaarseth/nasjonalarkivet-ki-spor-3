# Practice material for task D: the hardened version of the workflow.
# It lives outside .github/workflows/ so it never runs. Don't copy it.
name: Publish preview

on:
  # pull_request, not pull_request_target: code from a fork runs without secrets
  # and with a read-only token.
  pull_request:
    types: [opened, synchronize]

# Nothing by default; the job asks for what it needs.
permissions: {}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build
        env:
          # Through an env variable, so the title is data and never part of the script.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Building preview for: $PR_TITLE"
          pip install -r requirements.txt
          python build.py --out site/

      - name: Deploy
        # TODO: some-org/deploy-preview does not exist on GitHub. Replace it with a reviewed
        # action and pin it to a full commit SHA before use, never a branch like @main.
        uses: some-org/deploy-preview@REPLACE-WITH-REVIEWED-COMMIT-SHA
        with:
          user: preview-bot
          password: ${{ secrets.DEPLOY_PASSWORD }}
          path: site/

      - name: Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --body "Preview is ready"
